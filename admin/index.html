<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Panel — 100 Cámaras Vintage</title>
<link rel="icon" type="image/png" sizes="32x32" href="/images/brand/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bevan&family=Yellowtail&family=Archivo:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="panel.css">
<script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>

<!-- Entrada -->
<div class="login-screen" id="loginScreen" hidden>
  <div class="login-box">
    <img src="/images/brand/logo-badge.png" alt="">
    <h1>Panel de 100 Cámaras</h1>
    <p>Entrá con tu usuario para editar la web.</p>
    <button type="button" class="abtn" id="loginBtn">Entrar</button>
  </div>
</div>

<!-- Panel -->
<div id="app" hidden>
<header class="site-header">
  <div class="admin-bar">
    <span class="tag">🛠 Panel de control <small>— lo ves solo vos</small></span>
    <button type="button" class="abtn" id="newBtn">＋ Producto nuevo</button>
    <button type="button" class="abtn" id="orderBtn">↕ Acomodar</button>
    <button type="button" class="abtn" id="hiddenBtn">👁 Solo ocultas</button>
    <button type="button" class="abtn publish" id="publishBtn" disabled>Publicar en la web <span id="publishCount"></span></button>
    <a class="abtn quiet" href="/" target="_blank" rel="noopener">Ver la web</a>
    <button type="button" class="abtn quiet" id="logoutBtn">Salir</button>
  </div>
  <div class="header-inner">
    <a class="wordmark" href="/admin/">
      <img src="/images/brand/logo-badge.png" alt="" class="site-logo" width="48" height="48">
      <span class="wordmark-top">100</span>
      <span class="wordmark-bottom">Cámaras</span>
      <img src="/images/brand/vintage-script.png" alt="Vintage" class="wordmark-vintage-img">
    </a>
    <div class="header-tools">
      <span class="count" id="countTxt"></span>
      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" placeholder="Buscar por nombre o código…" autocomplete="off">
      </div>
    </div>
  </div>
  <div class="category-bar" id="categoryBar"></div>
  <div class="category-bar brand-bar" id="brandBar"></div>
  <div class="order-banner" id="orderBanner" hidden><b>↕ Modo acomodar.</b> <span id="orderBannerTxt"></span></div>
</header>

<main>
  <section class="grid pgrid" id="grid"></section>
  <p id="emptyState" class="empty-state" hidden>No hay productos que coincidan.</p>
</main>
</div>

<!-- Editor -->
<div class="modal-overlay" id="editOverlay" hidden>
  <div class="pmodal" role="dialog" aria-modal="true"><div id="editBody"></div></div>
</div>

<!-- Publicar -->
<div class="modal-overlay" id="pubOverlay" hidden>
  <div class="pmodal small" role="dialog" aria-modal="true"><div id="pubBody"></div></div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="panel.js"></script>
</body>
</html>
