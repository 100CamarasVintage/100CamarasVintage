backend:
  name: github
  repo: 100CamarasVintage/100CamarasVintage
  branch: main

media_folder: "images"
public_folder: "/images"

locale: "es"

collections:
  - name: "productos"
    label: "Productos"
    label_singular: "Producto"
    folder: "content/productos"
    create: true
    extension: "json"
    format: "json"
    slug: "producto-{{fields.id}}"
    identifier_field: title
    summary: "{{title}} — {{price}} ({{category}})"
    sortable_fields: ["title", "price", "id"]
    fields:
      - { label: "ID (se completa solo al guardar, no hace falta escribir nada)", name: "id", widget: "number", required: false }
      - { label: "Título", name: "title", widget: "string", required: true }
      - { label: "Precio (ej: $120.000 o Consultar)", name: "price", widget: "string", required: true }
      - label: "Categorías (podés tildar varias)"
        name: "category"
        widget: "select"
        multiple: true
        required: false
        options:
          - "Nuevos ingresos"
          - "Cámaras analógicas"
          - "Cámaras point and shoot"
          - "Cámaras digitales"
          - "Cámaras nuevas en caja sin uso"
          - "Lentes"
          - "Flashes"
          - "Raras/coleccionables"
          - "TLR"
          - "Micro 4/3"
          - "Cámaras de fuelle"
          - "Filmadoras a cuerda"
          - "Otros"
          - "Para deco o restauración"
          - "Nikon"
          - "Canon"
          - "Pentax"
          - "Olympus"
          - "Yashica"
          - "Fuji"
          - "Soviéticas"
          - "Minolta"
          - "Kodak"
          - "Sony"
      - { label: "Código de producto", name: "code", widget: "string", required: false }
      - { label: "Descripción", name: "description", widget: "text", required: true }
      - label: "Fotos"
        name: "photos"
        widget: "list"
        field: { label: "Foto", name: "photo", widget: "image" }
      - { label: "Foto principal (miniatura)", name: "thumb", widget: "image", required: false }

  - name: "orden_catalogo"
    label: "Orden del catalogo"
    files:
      - name: "orden"
        label: "Orden del catalogo"
        description: "Arrastra las camaras (tocando el icono de la izquierda de cada fila) para acomodarlas como quieras que aparezcan en la pagina. Las que no agregues aca aparecen arriba de todo, como recien llegadas, hasta que las ubiques en la lista."
        file: "content/orden.json"
        fields:
          - label: "Camaras en orden (arrastra para reacomodar)"
            name: "items"
            widget: "list"
            summary: "{{fields.producto}}"
            field:
              label: "Camara"
              name: "producto"
              widget: "relation"
              collection: "productos"
              search_fields: ["title", "code", "id"]
              value_field: "id"
              display_fields: ["{{title}} - {{code}}"]
