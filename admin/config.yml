backend:
  name: github
  repo: 100CamarasVintage/100CamarasVintage
  branch: main

publish_mode: editorial_workflow

media_folder: "images"
public_folder: "/images"

locale: "es"

collections:
  - name: "productos"
    label: "Productos"
    label_singular: "Producto"
    folder: "content/productos"
    create: true
    extension: "json"
    format: "json"
    slug: "producto-{{fields.id}}"
    identifier_field: title
    summary: "{{title}} — {{price}} ({{category}})"
    sortable_fields: ["title", "price", "orden"]
    fields:
      - { label: "ID (no tocar, se genera solo)", name: "id", widget: "number", required: true }
      - label: "Orden manual (opcional)"
        name: "orden"
        widget: "number"
        required: false
        hint: "Para acomodar el orden en que aparece en la página. Los productos con un número más bajo aparecen primero. Los que no tienen número quedan al final, ordenados por más nuevo. Ejemplo: si querés que un producto aparezca primero, ponele 1; para que aparezca segundo, ponele 2; y así. Dejá espacio entre números (1, 2, 3...) para poder insertar otros después."
      - { label: "Título", name: "title", widget: "string", required: true }
      - { label: "Precio (ej: $120.000 o Consultar)", name: "price", widget: "string", required: true }
      - label: "Categorías (podés tildar varias)"
        name: "category"
        widget: "select"
        multiple: true
        required: false
        options:
          - "Nuevos ingresos"
          - "Cámaras analógicas"
          - "Cámaras point and shoot"
          - "Cámaras digitales"
          - "Cámaras nuevas en caja sin uso"
          - "Lentes"
          - "Flashes"
          - "Raras/coleccionables"
          - "TLR"
          - "Micro 4/3"
          - "Cámaras de fuelle"
          - "Filmadoras a cuerda"
          - "Otros"
          - "Para deco o restauración"
          - "Nikon"
          - "Canon"
          - "Pentax"
          - "Olympus"
          - "Yashica"
          - "Fuji"
          - "Soviéticas"
          - "Minolta"
          - "Kodak"
          - "Sony"
      - { label: "Código de producto", name: "code", widget: "string", required: false }
      - { label: "Descripción", name: "description", widget: "text", required: true }
      - label: "Fotos"
        name: "photos"
        widget: "list"
        field: { label: "Foto", name: "photo", widget: "image" }
      - { label: "Foto principal (miniatura)", name: "thumb", widget: "image", required: false }
